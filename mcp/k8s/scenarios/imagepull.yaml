# Chaos scenario: ImagePullBackOff. A bad/unavailable image reference from a recent deploy —
# the container never starts. Fix = rollback_deploy to the last good image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: prod
  labels: { app: checkout }
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: app
          image: ghcr.io/deadman-sre/checkout-does-not-exist:v9.9.9
          resources:
            requests: { memory: "64Mi" }
            limits: { memory: "512Mi" }
