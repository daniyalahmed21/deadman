# Redis for the alert-ingestion queue (BullMQ). The queue is durable, so data survives a
# restart via the named volume.
#   docker compose -f docker-compose.redis.yml up -d
# Then:  DEADMAN_ALERTS=1 pnpm start
services:
  redis:
    image: redis:7-alpine
    container_name: deadman-redis
    command: ["redis-server", "--appendonly", "yes"] # AOF persistence = durable queue
    ports:
      - "6379:6379"
    volumes:
      - deadman-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  deadman-redis-data:
