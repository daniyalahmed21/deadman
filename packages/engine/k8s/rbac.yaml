# Least-privilege RBAC for connecting DEADMAN to a REAL cluster.
#
# DEADMAN drives the cluster only through the verbs its tools actually use — read telemetry, and
# the specific remediations behind the approval gate. Give it exactly this, no cluster-admin.
#
# ⚠️ NAMESPACE: this manifest is pinned to `prod`. It MUST match your `KUBE_NAMESPACE`. If yours
# differs, rewrite every `namespace: prod` (ServiceAccount, Role, RoleBinding, ClusterRoleBinding
# subject) — the one-liner does it:
#
#   NS=your-namespace
#   sed "s/namespace: prod/namespace: $NS/g" k8s/rbac.yaml | kubectl apply -f -
#   # then point a kubeconfig at this ServiceAccount and run:
#   DEADMAN_CLUSTER=kind KUBE_CONTEXT=<your-context> KUBE_NAMESPACE=$NS pnpm start
#
# The namespaced Role below is enough for investigate + the in-namespace remediations
# (restart / bump_memory / rollback / scale / delete_pvc). The ClusterRole at the bottom is
# OPTIONAL and elevated — apply it only if you want node operations (cordon/drain) and the
# rehearsal sandbox (which forks the workload into an ephemeral namespace). Omit it to keep
# DEADMAN namespace-bound (rehearsal + node ops are then unavailable, everything else still works).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deadman
  namespace: prod
---
# Namespaced permissions — read evidence, and mutate only the workloads it remediates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deadman-sre
  namespace: prod
rules:
  # --- read: investigation evidence ---
  - apiGroups: [""]
    resources: [pods, pods/log, events, resourcequotas, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: [get, list] # kubectl top (working-set memory)
  # --- write: the gated remediations (restart / bump_memory / rollback / scale) ---
  - apiGroups: ["apps"]
    resources: [deployments, deployments/scale]
    verbs: [get, patch, update]
  # --- write: delete_pvc (irreversible; still gated at the approval layer) ---
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deadman-sre
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deadman-sre
subjects:
  - kind: ServiceAccount
    name: deadman
    namespace: prod
---
# OPTIONAL / ELEVATED — node operations + the rehearsal sandbox. Apply only if you need them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deadman-cluster
rules:
  # cordon_node / drain_node
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list] # drain enumerates pods across namespaces
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create] # drain evicts
  # rehearse_remediation forks the workload into a throwaway namespace, then deletes it. The
  # namespace name is generated at runtime, so these must be cluster-wide (not namespaced).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, delete, get]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [create, get, list, watch, patch, delete] # apply the fork + watch its rollout
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch] # read the forked pods' state during the rehearsal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deadman-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deadman-cluster
subjects:
  - kind: ServiceAccount
    name: deadman
    namespace: prod
